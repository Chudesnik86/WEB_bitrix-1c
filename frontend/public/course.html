<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Курс</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/student.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="/courses" class="logo" id="user-name">Студент</a>
            <a href="/login" id="logout-link" style="display: none;">Выйти</a>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="course-header">
                <a href="/courses" class="back-link">← Назад к курсам</a>
                <h1 id="course-title">Загрузка...</h1>
            </div>
            
            <div class="course-tabs">
                <button class="tab-btn active" data-tab="content">Содержание</button>
                <button class="tab-btn" data-tab="progress">Прогресс и оценки</button>
            </div>

            <div id="course-loading" class="loading">
                <div class="skeleton skeleton-title"></div>
                <div class="skeleton skeleton-text"></div>
                <div class="skeleton skeleton-text" style="width: 60%;"></div>
            </div>
            <div id="course-error" class="error" style="display: none;"></div>

            <div id="tab-content" class="tab-content active">
                <div id="course-content"></div>
            </div>

            <div id="tab-progress" class="tab-content" style="display: none;">
                <div id="course-progress"></div>
            </div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const courseId = parseInt(urlParams.get('id')) || 0;
    </script>
    <script src="/js/course.js"></script>
</body>
</html>
